<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Arbind Stationary</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#0808d0,#05058f);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:22px;
    padding:35px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-family:'Playfair Display',serif;
    font-size:27px;
    color:#0808d0;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:28px;
}

label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#444;
    margin-bottom:7px;
}

.input-box{
    position:relative;
    margin-bottom:18px;
}

input{
    width:100%;
    height:50px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:0 45px 0 15px;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#0808d0;
    box-shadow:0 0 0 3px rgba(8,8,208,.08);
}

.icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    cursor:pointer;
    font-size:18px;
}

.options{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
}

.forgot{
    color:#0808d0;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
}

.login-btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:10px;
    background:#0808d0;
    color:white;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    cursor:pointer;
    font-size:14px;
}

.login-btn:hover{
    background:#05058f;
}

.message{
    display:none;
    padding:10px;
    border-radius:8px;
    font-size:12px;
    margin-bottom:15px;
    text-align:center;
}

.error{
    background:#fff0f0;
    color:#d62828;
}

.success{
    background:#effbe7;
    color:#4b8500;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0;
    color:#aaa;
    font-size:11px;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    background:#eee;
    flex:1;
}

.create{
    text-align:center;
    color:#777;
    font-size:13px;
}

.create a{
    color:#0808d0;
    font-weight:600;
    text-decoration:none;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#777;
    font-size:12px;
    text-decoration:none;
}

@media(max-width:450px){
    .login-box{
        padding:30px 20px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">✒ Arbind Stationary</div>

    <div class="subtitle">
        Apne account me login karke shopping continue karein
    </div>

    <div id="errorMsg" class="message error"></div>
    <div id="successMsg" class="message success"></div>

    <!-- PHONE -->

    <label>Phone Number</label>

    <div class="input-box">

        <input
            type="tel"
            id="phone"
            maxlength="10"
            placeholder="10-digit phone number"
        >

        <span class="icon">📱</span>

    </div>

    <!-- PASSWORD -->

    <label>Password</label>

    <div class="input-box">

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
            id="eye"
        >👁️</button>

    </div>

    <div class="options">

        <span
            class="forgot"
            onclick="forgotPassword()"
        >
            Forgot Password?
        </span>

    </div>

    <button
        class="login-btn"
        onclick="login()"
    >
        Login
    </button>

    <div class="divider">OR</div>

    <div class="create">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

    <div class="back">
        <a href="index.html">← Back to Shopping</a>
    </div>

</div>


<script>

function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");

    if(password.type === "password"){

        password.type = "text";
        eye.textContent = "🙈";

    }else{

        password.type = "password";
        eye.textContent = "👁️";

    }
}


function showError(text){

    const error =
        document.getElementById("errorMsg");

    const success =
        document.getElementById("successMsg");

    success.style.display="none";

    error.textContent=text;
    error.style.display="block";
}


function showSuccess(text){

    const error =
        document.getElementById("errorMsg");

    const success =
        document.getElementById("successMsg");

    error.style.display="none";

    success.textContent=text;
    success.style.display="block";
}


function login(){

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;


    if(!/^[6-9]\d{9}$/.test(phone)){

        showError(
            "⚠️ Sahi 10-digit phone number enter karein."
        );

        return;
    }


    if(!password){

        showError(
            "⚠️ Password enter karein."
        );

        return;
    }


    const accounts =
        JSON.parse(
            localStorage.getItem("arbindAccounts") || "[]"
        );


    const account =
        accounts.find(
            user => user.phone === phone
        );


    if(!account){

        showError(
            "⚠️ Is phone number se koi account nahi mila."
        );

        return;
    }


    if(account.password !== password){

        showError(
            "⚠️ Password galat hai."
        );

        return;
    }


    /* LOGIN SAVE */

    localStorage.setItem(
        "customerLogin",
        JSON.stringify({
            loggedIn:true,
            phone:account.phone,
            name:account.name,
            loginTime:new Date().toISOString()
        })
    );


    showSuccess(
        "✅ Login successful! Welcome " + account.name
    );


    setTimeout(function(){

        const redirect =
            sessionStorage.getItem(
                "redirectAfterLogin"
            ) || "account.html";

        sessionStorage.removeItem(
            "redirectAfterLogin"
        );

        window.location.href=redirect;

    },800);

}


function forgotPassword(){

    const phone =
        document.getElementById("phone").value.trim();


    if(!/^[6-9]\d{9}$/.test(phone)){

        showError(
            "⚠️ Pehle apna registered phone number enter karein."
        );

        return;
    }


    const accounts =
        JSON.parse(
            localStorage.getItem("arbindAccounts") || "[]"
        );


    const account =
        accounts.find(
            user => user.phone === phone
        );


    if(!account){

        showError(
            "⚠️ Ye phone number registered nahi hai."
        );

        return;
    }


    /*
      Frontend demo:

      Real website me yahan OTP
      + backend password reset lagana hoga.
    */

    showSuccess(
        "📱 Account mil gaya. Password reset ke liye OTP verification system lagaya ja sakta hai."
    );

}

</script>

</body>
</html>
